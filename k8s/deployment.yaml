apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app 
          image: docker.io/aturytsia/demo-app:87c1e8451f16cd2a100841a56437cb0c1663ee04
          imagePullPolicy: Always
